[[audits.ariel-os.audits.async-io]]
who = "Antoine Lavandier <antoine.lavandier@inria.fr>"
criteria = "safe-to-deploy"
delta = "1.13.0 -> 2.0.0"
notes = """
New unsafe code seems reasonable and uses of unsafe code have proper accompanying comments.
Some exceptions:
- Win32 unsafe functions that don't have safety docs.
- `polling::os::kqueue::Process:new`. This is called in `reactor::kqueue::Registration::add` which is pub(crate).
- Same remark in `reactor::kqueue::Registration::delete`.
"""

