  - id: DF-NOSTD-01
    title_zh: 是否/何时使用 no_std / bare-metal
    title_en: When to Use no_std / Bare-Metal Decision Tree
    source:
      file: concept/00_meta/knowledge_topology/11_semantic_model_atlas.md
      anchor: "#df-nostd-01"
    covered_concepts:
      [
        ex:EmbeddedSystems,
        ex:AsyncInNo_stdAndEmbeddedSystems,
        ex:CustomAllocators,
        ex:TheRustRuntime,
        ex:FerroceneTheDeliveredQualifiedRustToolchainForSafetyCriticalSystems,
      ]
    rustc_error_codes: [E0152, E0463]
    nodes:
      - id: ENTRY
        type: condition
        label: "入口：判断是否应使用 no_std / bare-metal"
      - id: Q1
        type: decision
        condition: "目标 RAM + Flash 是否 ≤ 256 KB？"
        quantitative: true
        threshold: "RAM + Flash ≤ 256 KB"
      - id: Q2
        type: decision
        condition: "硬实时抖动容差是否 ≤ 100 μs？"
        quantitative: true
        threshold: "抖动 ≤ 100 μs"
      - id: Q3
        type: decision
        condition: "是否需要自定义 panic handler / 全局分配器（需求项数 ≥ 1）？"
        quantitative: true
        threshold: "自定义运行时需求 ≥ 1"
      - id: Q4
        type: decision
        condition: "是否已有目标平台的 no_std PAC / HAL crate（可用 crate 数 ≥ 1）？"
        quantitative: true
        threshold: "可用 PAC/HAL crate ≥ 1"
      - id: Q5
        type: decision
        condition: "是否可接受 nightly / 手写寄存器封装（场景数 ≥ 1）？"
        quantitative: true
        threshold: "手写 PAC 场景 ≥ 1"
      - {id: C1, type: conclusion, label: "结论：使用 std 目标即可，无需 no_std"}
      - {id: C2, type: conclusion, label: "结论：使用 no_std + alloc，保留动态分配"}
      - {id: C3, type: conclusion, label: "结论：使用 no_std + RTIC / embassy 异步运行时"}
      - {id: C4, type: conclusion, label: "结论：bare-metal + 自定义 panic handler / global_allocator"}
      - {id: C5, type: conclusion, label: "结论：bare-metal + embedded-alloc / panic-probe 现成方案"}
      - {id: C6, type: conclusion, label: "结论：评估自己写 PAC/HAL 或换平台（注意 E0463 找不到 crate）", rustc_error_codes: [E0463]}
      - {id: C7, type: conclusion, label: "结论：自定义 lang item 时避免 E0152 重复 lang item", rustc_error_codes: [E0152]}
    edges:
      - {from: ENTRY, to: Q1, label: "入口"}
      - {from: Q1, to: Q2, label: "是"}
      - {from: Q1, to: C1, label: "否"}
