  - id: DF-PIN-01
    title_zh: Pin 与自引用判定树
    title_en: Pin and Self-Referential Types Decision Tree
    source:
      file: concept/00_meta/knowledge_topology/09_reasoning_judgment_tree_atlas.md
      anchor: "#df-pin-01-pin-与自引用判定树"
    covered_concepts: [ex:PinAndUnpin, ex:AsyncProgramming, ex:Lifetimes]
    rustc_error_codes: [E0733]
    nodes:
      - id: P
        type: condition
        label: "症状：需要判断自引用结构或 async future 是否需要 Pin<T>"
      - id: Q1
        type: decision
        condition: "类型 T 中指向自身字段的引用/指针数是否 ≥1 个？"
        quantitative: true
        threshold: "自引用字段数 ≥ 1"
      - id: Q2
        type: decision
        condition: "该类型是否需要跨 ≥1 个 .await 协作点保持引用活跃？"
        quantitative: true
        threshold: "跨 await 点数 ≥ 1"
      - id: Q3
        type: decision
        condition: "T: Unpin 的实现数是否 = 1？"
        quantitative: true
        threshold: "Unpin impl 数 = 1"
      - {id: R1, type: conclusion, label: "根因：无自引用字段，无需 Pin"}
      - {id: R2, type: conclusion, label: "根因：async future 自引用；递归 async fn 需 Pin + indirection（E0733）"}
      - {id: R3, type: conclusion, label: "根因：Unpin 自引用；栈上临时固定可用 Pin<&mut T>"}
      - {id: R4, type: conclusion, label: "根因：!Unpin 自引用；需 Pin<Box<T>> 或 unsafe Pin::new_unchecked + PhantomPinned"}
      - {id: V1, type: conclusion, label: "验证回边：cargo check；unsafe 固定用 cargo miri test"}
    edges:
      - {from: P, to: Q1, label: "入口"}
      - {from: Q1, to: R1, label: "否"}
      - {from: Q1, to: Q2, label: "是"}
      - {from: Q2, to: R2, label: "是"}
      - {from: Q2, to: Q3, label: "否"}
      - {from: Q3, to: R3, label: "是"}
      - {from: Q3, to: R4, label: "否"}
      - {from: R1, to: V1, label: "验证"}
      - {from: R2, to: V1, label: "验证"}
      - {from: R3, to: V1, label: "验证"}
      - {from: R4, to: V1, label: "验证"}

