      - id: Q1
        type: decision
        condition: "用户/主体数量是否 ≥ 10^4 或需要跨组织授权？"
        quantitative: true
        threshold: "主体数 ≥ 10^4 或跨组织"
      - id: Q2
        type: decision
        condition: "授权决策是否依赖 ≥ 3 类动态属性（环境、风险、资源属性）？"
