  - id: J-LANG-01
    title_zh: 编程语言选择判定树
    title_en: Programming Language Selection Judgment Tree
    source:
      file: concept/00_meta/knowledge_topology/11_semantic_model_atlas.md
      anchor: "#语言选择决策树-j-lang-01"
    covered_concepts:
      [
        ex:ProgrammingLanguageFoundations,
        ex:RustVsC,
        ex:RustVsGo,
        ex:RustVsZig,
        ex:RustVsJava,
        ex:RustVsPython,
        ex:RustVsJavaScript,
        ex:RustVsTypeScript,
        ex:RustVsKotlin,
        ex:RustVsSwift,
        ex:RustVsScala,
        ex:RustVsRuby,
        ex:FerroceneTheDeliveredQualifiedRustToolchainForSafetyCriticalSystems,
        ex:ZeroCostAbstractions,
        ex:MemoryManagement,
        ex:SafeAndEffectiveUnsafeRust,
      ]
    nodes:
      - id: LANG-B
        type: condition
        label: "入口：根据项目约束选择编程语言"
      - id: LANG-Q1
        type: decision
        condition: "硬实时延迟要求：p99 延迟是否 ≤ 100 μs 且抖动容差 ≤ 5%？"
        quantitative: true
        threshold: "p99 延迟 ≤ 100 μs 且抖动 ≤ 5%"
      - id: LANG-Q2
        type: decision
        condition: "安全关键认证等级是否 ≥ ASIL-D / DAL-A？"
        quantitative: true
        threshold: "认证等级 ≥ ASIL-D / DAL-A"
      - id: LANG-Q3
        type: decision
        condition: "可接受的最大 GC 暂停是否 ≤ 1 ms（即零容忍垃圾回收）？"
        quantitative: true
        threshold: "GC 暂停 ≤ 1 ms"
      - id: LANG-Q4
        type: decision
        condition: "是否需要依赖类型 / 高阶类型（HKT）/ 线性类型等高级类型特性（需求项数 ≥ 1）？"
        quantitative: true
        threshold: "高级类型特性需求项数 ≥ 1"
      - id: LANG-Q5
        type: decision
        condition: "目标领域现成库数量是否 ≥ 1000（强成熟生态依赖）？"
        quantitative: true
        threshold: "目标领域库数 ≥ 1000"
      - id: LANG-Q6
        type: decision
        condition: "团队熟练目标语言的工程师比例是否 ≥ 50%？"
        quantitative: true
        threshold: "团队熟练度 ≥ 50%"
      - {id: LANG-R1, type: conclusion, label: "根因：硬实时 / 超低延迟约束占主导"}
      - {id: LANG-R2, type: conclusion, label: "根因：安全关键认证约束占主导"}
      - {id: LANG-R3, type: conclusion, label: "根因：GC 零容忍约束占主导"}
      - {id: LANG-R4, type: conclusion, label: "根因：类型系统表达力约束占主导"}
      - {id: LANG-R5, type: conclusion, label: "根因：成熟生态约束占主导"}
      - {id: LANG-R6, type: conclusion, label: "根因：团队 expertise 约束占主导"}
      - {id: LANG-R7, type: conclusion, label: "根因：无极端约束，选择通用均衡方案"}
      - {id: LANG-F1, type: conclusion, label: "结论：C / Ada-SPARK / Rust + RTIC（硬实时）"}
      - {id: LANG-F2, type: conclusion, label: "结论：Ada/SPARK / Rust（Ferrocene 路径）（安全关键）"}
      - {id: LANG-F3, type: conclusion, label: "结论：Rust / C / C++ / Zig / D / Nim（无 GC）"}
      - {id: LANG-F4, type: conclusion, label: "结论：Haskell / OCaml / F# / Idris / Agda（高级类型）"}
      - {id: LANG-F5, type: conclusion, label: "结论：Go / Java / C# / Python / JavaScript / TypeScript（成熟生态）"}
      - {id: LANG-F6, type: conclusion, label: "结论：团队熟悉的主流语言 / Rust（团队 expertise）"}
      - {id: LANG-F7, type: conclusion, label: "结论：Rust 作为默认均衡选择（无极端约束）"}
      - {id: LANG-V1, type: conclusion, label: "验证回边：构建原型、跑 benchmark、评估生态与团队学习成本"}
    edges:
      - {from: LANG-B, to: LANG-Q1, label: "入口"}
      - {from: LANG-Q1, to: LANG-R1, label: "是"}
      - {from: LANG-Q1, to: LANG-Q2, label: "否"}
      - {from: LANG-Q2, to: LANG-R2, label: "是"}
      - {from: LANG-Q2, to: LANG-Q3, label: "否"}
      - {from: LANG-Q3, to: LANG-R3, label: "是"}
      - {from: LANG-Q3, to: LANG-Q4, label: "否"}
      - {from: LANG-Q4, to: LANG-R4, label: "是"}
      - {from: LANG-Q4, to: LANG-Q5, label: "否"}
