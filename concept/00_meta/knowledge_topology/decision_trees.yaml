  - id: J-CONC-01
    title_zh: 并发与分布式模型选择判定树
    title_en: Concurrency and Distributed Model Selection Judgment Tree
    source:
      file: concept/00_meta/knowledge_topology/11_semantic_model_atlas.md
      anchor: "#并发分布式模型选择决策树-j-conc-01"
    covered_concepts:
      [
        ex:ConcurrencyModels,
        ex:AsyncProgramming,
        ex:DistributedSystems,
        ex:DistributedConsensus,
        ex:CRDTTypeZooStateBasedOpBasedAndTheMergeLattice,
        ex:EmbeddedSystems,
        ex:SendAndSyncAutoTraitsAsCompileTimeConcurrencyContracts,
        ex:ParallelDistributedPatternSpectrum,
        ex:ProcessCalculiForRustCSPCCSAndThePiCalculus,
        ex:SafeAndEffectiveUnsafeRust,
      ]
    nodes:
      - id: CONC-B
        type: condition
        label: "入口：选择并发 / 并行 / 分布式模型"
      - id: CONC-Q1
        type: decision
        condition: "单进程内共享可变状态访问点是否 ≥ 1？"
        quantitative: true
        threshold: "共享可变状态访问点 ≥ 1"
      - id: CONC-Q2
        type: decision
        condition: "任务间消息传递通道数是否 ≥ 1？"
        quantitative: true
        threshold: "消息通道数 ≥ 1"
      - id: CONC-Q3
        type: decision
        condition: "消息传递是否跨节点或需要 Actor 容错隔离（节点数 ≥ 2）？"
        quantitative: true
        threshold: "节点数 ≥ 2"
      - id: CONC-Q4
        type: decision
        condition: "CPU 密集型计算任务占比是否 ≥ 60%？"
        quantitative: true
        threshold: "CPU 任务占比 ≥ 60%"
      - id: CONC-Q5
        type: decision
        condition: "I/O 等待时间占比是否 ≥ 60% 或并发连接数 ≥ 1000？"
        quantitative: true
        threshold: "I/O 等待 ≥ 60% 或连接数 ≥ 1000"
      - id: CONC-Q6
        type: decision
        condition: "是否存在跨节点 / 地理分布或容错要求（节点数 ≥ 2）？"
        quantitative: true
        threshold: "分布式节点数 ≥ 2"
      - id: CONC-Q7
        type: decision
        condition: "跨网络强一致性写入比例是否 ≥ 80%？"
        quantitative: true
        threshold: "强一致性写入 ≥ 80%"
      - id: CONC-Q8
        type: decision
        condition: "是否需要 no_std / 嵌入式实时约束？"
        quantitative: true
        threshold: "实时约束 = 是"
      - {id: CONC-R1, type: conclusion, label: "根因：共享可变状态占主导"}
      - {id: CONC-R2, type: conclusion, label: "根因：进程内消息传递占主导"}
      - {id: CONC-R3, type: conclusion, label: "根因：Actor / 分布式容错占主导"}
      - {id: CONC-R4, type: conclusion, label: "根因：CPU 密集型并行占主导"}
      - {id: CONC-R5, type: conclusion, label: "根因：I/O 密集型高并发占主导"}
      - {id: CONC-R6, type: conclusion, label: "根因：强一致性分布式占主导"}
      - {id: CONC-R7, type: conclusion, label: "根因：弱一致性 / 分区容错占主导"}
      - {id: CONC-R8, type: conclusion, label: "根因：嵌入式实时约束占主导"}
      - {id: CONC-R9, type: conclusion, label: "根因：单线程顺序模型足够"}
      - {id: CONC-F1, type: conclusion, label: "结论：Mutex / RwLock + Arc（共享内存同步）"}
      - {id: CONC-F2, type: conclusion, label: "结论：channels（mpsc / mpmc / crossbeam）"}
      - {id: CONC-F3, type: conclusion, label: "结论：Actors（Actix / Akka / Erlang/Elixir）"}
      - {id: CONC-F4, type: conclusion, label: "结论：Rayon / scoped threads / MPI（CPU 并行）"}
      - {id: CONC-F5, type: conclusion, label: "结论：async/await + Tokio（I/O 高并发）"}
      - {id: CONC-F6, type: conclusion, label: "结论：Raft / Paxos / distributed consensus（强一致性）"}
      - {id: CONC-F7, type: conclusion, label: "结论：CRDTs / event sourcing / gRPC with retries（弱一致性 / 分区容错）"}
      - {id: CONC-F8, type: conclusion, label: "结论：RTIC / bare-metal interrupts（嵌入式实时）"}
      - {id: CONC-F9, type: conclusion, label: "结论：单线程顺序模型足够"}
      - {id: CONC-V1, type: conclusion, label: "验证回边：原型验证 + benchmark + 死锁/竞争检测 + 安全审查"}
    edges:
      - {from: CONC-B, to: CONC-Q1, label: "入口"}
