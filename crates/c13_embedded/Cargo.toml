[package]
name = "c13_embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust bare-metal embedded systems learning module"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["embedded", "bare-metal", "no-std", "microcontroller"]
categories = ["embedded", "no-std"]

[dependencies]
# C++ 互操作（可选）
cxx = { version = "1.0.198", optional = true }

# ESP32 系列 bare-metal HAL 与日志打印（可选，通过 `esp32c3-hal` feature 启用）
esp-hal = { workspace = true, optional = true, features = ["esp32c3", "rt"] }
esp-println = { workspace = true, optional = true, features = ["esp32c3", "uart"] }

# 仅在 ARM 嵌入式目标下启用真实硬件依赖
# host 环境 (x86_64 Windows) 下不使用这些依赖，确保 cargo check 通过
[target.'cfg(target_arch = "arm")'.dependencies]
# `critical-section-single-core` feature 提供 `_critical_section_1_0_acquire/release` 实现。
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
volatile-register = { workspace = true }
# critical-section 是 no_std 并发事实标准；显式声明便于示例使用。
critical-section = "1.2"
# defmt / RTT 日志依赖未进入 workspace 依赖表，默认注释以保持 host `cargo check` 通过。
# 需要在真实 ARM 目标上运行 `no_std_defmt_rtt` 示例时取消注释：
# defmt = "0.3"
# defmt-rtt = "0.4"
# panic-probe = { version = "0.3", features = ["print-defmt"] }

# 仅在 RISC-V 嵌入式目标下启用真实硬件依赖
[target.'cfg(target_arch = "riscv32")'.dependencies]
# 注意：不启用 `critical-section-single-hart` feature。esp-hal 1.x 会自行提供
# ESP32-C3 的 critical-section 实现；启用该 feature 会与 esp-hal 的 restore-state
# 选择冲突。裸机 RISC-V 示例如需 critical-section，请在独立 crate 中单独配置。
riscv = { workspace = true }
riscv-rt = { workspace = true }
panic-halt = { workspace = true }
# critical-section 是 no_std 并发事实标准；显式声明便于示例使用。
# 禁用 default-features 避免与 esp-hal 的 restore-state 选择冲突。
critical-section = { version = "1.2", default-features = false }

[build-dependencies]
bindgen = { workspace = true }

# criterion 仅在 host 类目标（x86_64 / aarch64 / wasm32）上用作 dev-dependency，
# 避免它及其传递依赖（either、itertools 等）在 ARM/RISC-V 裸机交叉编译时被拉取。
[target."cfg(any(target_arch = \"x86_64\", target_arch = \"aarch64\", target_arch = \"wasm32\"))".dev-dependencies]
criterion = { workspace = true }

[lib]
name = "c13_embedded"
path = "src/lib.rs"

[[bin]]
name = "embedded_demo"
path = "src/main.rs"

[[bench]]
name = "embedded_benchmarks"
harness = false

[features]
default = []
# embedded feature 用于在 ARM 目标下启用硬件相关代码路径
embedded = []
# cxx 互操作支持
cxx-interop = ["dep:cxx"]
# ESP32-C3 bare-metal HAL 示例支持（启用 esp-hal / esp-println）
esp32c3-hal = ["dep:esp-hal", "dep:esp-println"]

[lints.rust]
# bare-metal 编程必须允许 unsafe 代码（内存映射寄存器、原始指针操作）
unsafe_code = "allow"
missing_docs = "allow"
# 声明 nightly 预览模块使用的自定义 cfg，避免 unexpected_cfgs 警告
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)', 'cfg(kani)'] }

[lints.clippy]
borrowed_box = "deny"
manual_div_ceil = "deny"
non_minimal_cfg = "deny"
