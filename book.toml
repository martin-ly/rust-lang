[book]
title = "Rust 分层概念知识体系"
authors = ["Rust Concept Knowledge Base Team"]
description = "Rust 分层概念知识体系 — 从入门直觉到形式化验证"
src = "concept"
# NOTE 2026-10-13: mdbook 0.5.x 移除了 [book] build-dir 字段（构建输出目录改由
# `mdbook build -d/--dest-dir` 指定，默认 ./book，与旧 build-dir 值一致）。
# 旧配置在 mdbook 0.5.3 下报 "unknown field build-dir"，已移除以保持默认 ./book。
language = "zh"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
mathjax-support = true
# NOTE 2026-10-13: mdbook 0.5.x 移除了 [output.html] copy-fonts 字段（字体复制改由
# additional-css / 主题资源承担）。旧字段导致 "Failed to deserialize output.html"，
# 构建静默回退默认 HTML 配置，已移除以恢复显式配置生效。
additional-js = ["theme/mermaid-init.js"]

[output.html.search]
# 全站搜索：500+ 概念页导致 searchindex.js ~55 MB，mdbook 会发出体积警告。
# 该警告仅提示索引较大；mdbook >= 0.4.52 已改为点击搜索框时才懒加载索引，
# 不影响首屏性能。当前策略：保持搜索开启，接受该警告，不在配置层面禁用搜索。
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true

# [preprocessor.toc]
# command = "mdbook-toc"
# marker = "<!-- toc -->"
# NOTE: mdbook-toc v0.15.4 is INCOMPATIBLE with mdbook v0.4.52.
# It fails with "Unable to parse the input" even on minimal books
# (single file, no toc markers). Upstream regression; tracked at
# https://github.com/badboy/mdbook-toc/issues. Disabled until fix.
# No files in this project use <!-- toc --> markers.

[output.html.fold]
enable = true
level = 1

